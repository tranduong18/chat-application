services:
  postgres:
    image: postgres:18.4
    container_name: postgres-chat-application
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: chat_application
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elearning_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - chat-application-network

  redis:
    image: redis:8.6.4
    container_name: redis-chat-application
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chat-application-network

volumes:
  postgres-data:
  redis-data:

networks:
  chat-application-network: